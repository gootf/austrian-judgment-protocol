  - id: AD01
    claim: "Advertising is integral to the competitive market process: in the neo-Austrian view competition is a rivalrous process in perpetual disequilibrium, and advertising is an essential means through which entrepreneurs increase product utility to consumers (quality changes, warranty, availability)."

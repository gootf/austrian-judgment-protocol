    confidence: high
    evidence: "Ekelund & Saurman, Advertising and the Market Process"
    source: ekelund-saurman-advertising-market-process
    primitive: discovery-alertness
  - id: AD02
    claim: "Open-ended universe (Kirzner): consumers may be ignorant of their own ignorance; advertising is attention-grabbing that opens consumers' eyes to opportunities they had failed to notice — not preference manipulation. In a closed universe eyes cannot be opened because they were never closed."
    claim_type: source-derived
    confidence: high
    evidence: "Kirzner, Foreword to Ekelund & Saurman, Advertising and the Market Process"
    source: kirzner-foreword-advertising
    primitive: discovery-alertness
  - id: AD03
    claim: "Advertising itself is indirect information: the fact that a brand advertises conveys existence information even when the ad contains no price or quality content; the more frequently a good is advertised, the more likely consumers encounter it and purchase (both new and established products)."
